name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS
        run: |
          wget -q https://github.com/gbdev/rgbds/releases/download/v1.0.1/rgbds-linux-x86_64.tar.xz
          tar -xJf rgbds-linux-x86_64.tar.xz
          sudo install -m 755 rgbasm rgblink rgbfix rgbgfx /usr/local/bin/

      - name: Build ROM
        run: make

      - name: Copy ROM to play directory
        run: mkdir -p play/rom && cp main.gb play/rom/

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: garden-of-eden-gb
          path: main.gb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./play

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
